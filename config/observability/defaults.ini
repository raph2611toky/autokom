# AUTOKOM - Configuration non sensible de l'observabilite.
# Overrides locaux: /etc/autokom/observability.ini (hors Git)
# ATTENTION : les ecoutes publiques ne sont pas autorisees par ce module.
[jenkins]
host = 127.0.0.1
port = 8080
metrics_path = /prometheus/
job_name = jenkins

[prometheus]
host = 127.0.0.1
port = 9090
scrape_interval = 30s
retention = 15d
storage_path = /var/lib/prometheus/metrics2

[grafana]
host = 127.0.0.1
port = 3000
datasource_name = AUTOKOM Prometheus
datasource_uid = autokom-prometheus

[domains]
prometheus =
grafana =
letsencrypt_email =
