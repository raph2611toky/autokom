# AUTOKOM | hosts HTTP inconnus -> connexion fermee
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# AUTOKOM | noms TLS inconnus -> handshake refuse
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
