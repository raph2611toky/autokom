---
- name: AUTOKOM | Docker puis Jenkins et bases de donnees
  hosts: local
  connection: local
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - autokom_db_engine in ['postgresql', 'mysql', 'oracle', 'none']
  roles:
    - role: docker_engine
    - role: jenkins_server
    - role: database_server
