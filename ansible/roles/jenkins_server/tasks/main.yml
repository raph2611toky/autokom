---
- name: Read installed packages
  ansible.builtin.package_facts:
    manager: apt

- name: Install Jenkins Java prerequisites
  ansible.builtin.apt:
    name:
      - fontconfig
      - openjdk-21-jre
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when: "'jenkins' not in ansible_facts.packages"

- name: Ensure Jenkins repository key directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: "'jenkins' not in ansible_facts.packages"

- name: Download official Jenkins LTS signing key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'
  when: "'jenkins' not in ansible_facts.packages"

- name: Configure Jenkins LTS repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    filename: autokom-jenkins
    state: present
    update_cache: true
  when: "'jenkins' not in ansible_facts.packages"

# Secure newly installed Jenkins before package installation.
# Existing Jenkins hosts are handled by services.py with restart confirmation.
- name: Create Jenkins systemd override folder (new installations only)
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: '0755'
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Inspect existing Jenkins override before initial installation
  ansible.builtin.stat:
    path: /etc/systemd/system/jenkins.service.d/20-autokom-loopback.conf
  register: autokom_jenkins_existing_override
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Read prior AUTOKOM Jenkins override (safe reruns only)
  ansible.builtin.slurp:
    src: /etc/systemd/system/jenkins.service.d/20-autokom-loopback.conf
  register: autokom_jenkins_override_content
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode
    - autokom_jenkins_existing_override.stat.exists | default(false)

- name: Refuse replacing a foreign Jenkins override, allow AUTOKOM reruns
  vars:
    autokom_jenkins_expected_override: |
      # Managed by AUTOKOM: phase-2
      [Service]
      Environment="JENKINS_LISTEN_ADDRESS=127.0.0.1"
  ansible.builtin.assert:
    that:
      - not (autokom_jenkins_existing_override.stat.islnk | default(false))
      - (autokom_jenkins_override_content.content | b64decode) == autokom_jenkins_expected_override
    fail_msg: "A non-AUTOKOM Jenkins override exists; preserve it and inspect /etc/systemd/system/jenkins.service.d/20-autokom-loopback.conf"
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode
    - autokom_jenkins_existing_override.stat.exists | default(false)

- name: Bind new Jenkins installation to loopback before package setup
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/20-autokom-loopback.conf
    content: |
      # Managed by AUTOKOM: phase-2
      [Service]
      Environment="JENKINS_LISTEN_ADDRESS=127.0.0.1"
    owner: root
    group: root
    mode: '0644'
    force: false
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Reload systemd for new Jenkins override
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

# Jenkins' official APT repository may redirect its .deb to an unavailable mirror.
# Always attempt normal APT first (signed repository). On network mirror failure,
# download the SAME candidate version from selected HTTPS mirrors and verify its
# SHA-256 + byte length against APT's signed Packages metadata before installing.
- name: Install Jenkins LTS with verified mirror fallback
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode
  block:
    - name: Install Jenkins LTS from signed APT repository
      ansible.builtin.apt:
        name: jenkins
        state: present
        force_apt_get: true
      register: autokom_jenkins_apt_install
      retries: 2
      delay: 5
      until: autokom_jenkins_apt_install is succeeded
  rescue:
    - name: Download matching Jenkins LTS package from alternative HTTPS mirrors
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ role_path }}/files/autokom_jenkins_deb_fallback.py"
      register: autokom_jenkins_download
      changed_when: true

    - name: Install SHA-256-verified Jenkins LTS package with APT
      ansible.builtin.apt:
        deb: "{{ autokom_jenkins_download.stdout | trim }}"
        state: present
        force_apt_get: true

- name: Preview Jenkins package installation
  ansible.builtin.debug:
    msg: "Jenkins LTS would be installed after the repository is added."
  when:
    - "'jenkins' not in ansible_facts.packages"
    - ansible_check_mode

- name: Ensure Jenkins is enabled and active
  ansible.builtin.systemd_service:
    name: jenkins
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Check Docker runtime when Docker access requested
  ansible.builtin.command: docker info
  changed_when: false
  when:
    - autokom_jenkins_docker | bool
    - not ansible_check_mode

- name: Add Jenkins account to Docker group - grants root-equivalent access
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  when:
    - autokom_jenkins_docker | bool
    - not ansible_check_mode
