---
- name: Read installed packages
  ansible.builtin.package_facts:
    manager: apt

- name: Install Jenkins Java prerequisites
  ansible.builtin.apt:
    name:
      - fontconfig
      - openjdk-21-jre
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when: "'jenkins' not in ansible_facts.packages"

- name: Ensure Jenkins repository key directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: "'jenkins' not in ansible_facts.packages"

- name: Download official Jenkins LTS signing key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'
  when: "'jenkins' not in ansible_facts.packages"

- name: Configure Jenkins LTS repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    filename: autokom-jenkins
    state: present
    update_cache: true
  when: "'jenkins' not in ansible_facts.packages"

# Secure newly installed Jenkins before package installation.
# Existing Jenkins hosts are handled by services.py with restart confirmation.
- name: Create Jenkins systemd override folder (new installations only)
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: '0755'
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Inspect existing Jenkins override before initial installation
  ansible.builtin.stat:
    path: /etc/systemd/system/jenkins.service.d/20-autokom-loopback.conf
  register: autokom_jenkins_existing_override
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Refuse replacing an unexpected Jenkins override
  ansible.builtin.assert:
    that:
      - not autokom_jenkins_existing_override.stat.exists | default(false)
    fail_msg: "Override Jenkins already exists: inspect /etc/systemd/system/jenkins.service.d/20-autokom-loopback.conf"
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Bind new Jenkins installation to loopback before package setup
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/20-autokom-loopback.conf
    content: |
      # Managed by AUTOKOM: phase-2
      [Service]
      Environment="JENKINS_LISTEN_ADDRESS=127.0.0.1"
    owner: root
    group: root
    mode: '0644'
    force: false
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Reload systemd for new Jenkins override
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Install Jenkins LTS
  ansible.builtin.apt:
    name: jenkins
    state: present
  when:
    - "'jenkins' not in ansible_facts.packages"
    - not ansible_check_mode

- name: Preview Jenkins package installation
  ansible.builtin.debug:
    msg: "Jenkins LTS would be installed after the repository is added."
  when:
    - "'jenkins' not in ansible_facts.packages"
    - ansible_check_mode

- name: Ensure Jenkins is enabled and active
  ansible.builtin.systemd_service:
    name: jenkins
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Check Docker runtime when Docker access requested
  ansible.builtin.command: docker info
  changed_when: false
  when:
    - autokom_jenkins_docker | bool
    - not ansible_check_mode

- name: Add Jenkins account to Docker group - grants root-equivalent access
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  when:
    - autokom_jenkins_docker | bool
    - not ansible_check_mode
