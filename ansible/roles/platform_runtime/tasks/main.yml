---
- name: Vérifier Ubuntu et les services requis
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['os_family'] == 'Debian'

- name: Vérifier Docker sans le réinstaller
  ansible.builtin.command:
    argv: [docker, --version]
  changed_when: false
  check_mode: false

- name: Vérifier Nginx sans le réinstaller
  ansible.builtin.command:
    argv: [nginx, -v]
  changed_when: false
  check_mode: false

- name: Vérifier Certbot sans le réinstaller
  ansible.builtin.command:
    argv: [certbot, --version]
  changed_when: false
  check_mode: false

- name: Préparer le répertoire des règles DevSecOps publiques approuvées
  ansible.builtin.file:
    path: /usr/local/share/autokom-security
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Installer les règles Semgrep approuvées pour l'agent isolé
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/runtime/autokom-client-semgrep-rules.yml"
    dest: /usr/local/share/autokom-security/client-semgrep-rules.yml
    owner: root
    group: root
    mode: '0644'

- name: Préparer le compte de build client sans privilège Docker
  ansible.builtin.user:
    name: autokom-builder
    system: true
    create_home: true
    shell: /usr/sbin/nologin
    groups: []
    append: false

- name: Créer les répertoires protégés du runtime
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/autokom/client-runtime, owner: root, group: root, mode: '0700'}
    - {path: /var/lib/autokom/build-artifacts, owner: root, group: autokom-builder, mode: '2770'}
    - {path: /var/lib/autokom/acme, owner: root, group: root, mode: '0755'}
    - {path: /etc/autokom, owner: root, group: root, mode: '0750'}

# The broker runs as uid 0 but the Django service must be allowed to
# traverse this directory. The systemd unit keeps this owner/group on reboot.
- name: Autoriser uniquement le groupe Django à traverser le runtime Unix
  ansible.builtin.file:
    path: /run/autokom
    state: directory
    owner: root
    group: autokom
    mode: '0750'

- name: Installer le service root broker depuis AUTOKOM Core
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/systemd/autokom-platform-broker.service"
    dest: /etc/systemd/system/autokom-platform-broker.service
    owner: root
    group: root
    mode: '0644'
  notify: reload runtime units

- name: Installer le worker Django non privilégié
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../platform/backend/deployment_templates/autokom-deployment-worker.service.example"
    dest: /etc/systemd/system/autokom-deployment-worker.service
    owner: root
    group: root
    mode: '0644'
  notify: reload runtime units

- name: Installer la réconciliation DNS/HTTPS des domaines existants
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../platform/backend/deployment_templates/autokom-domain-reconciler.service.example"
    dest: /etc/systemd/system/autokom-domain-reconciler.service
    owner: root
    group: root
    mode: '0644'

- name: Installer le planificateur de réconciliation de domaines
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../platform/backend/deployment_templates/autokom-domain-reconciler.timer.example"
    dest: /etc/systemd/system/autokom-domain-reconciler.timer
    owner: root
    group: root
    mode: '0644'

- name: Installer la veille des changements de configuration DNS et HTTPS
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../platform/backend/deployment_templates/autokom-domain-reconciler.path.example"
    dest: /etc/systemd/system/autokom-domain-reconciler.path
    owner: root
    group: root
    mode: '0644'

- name: Recharger systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Démarrer le broker Unix
  ansible.builtin.systemd_service:
    name: autokom-platform-broker
    enabled: true
    state: restarted
  when: not ansible_check_mode

- name: Activer les tentatives DNS/HTTPS automatiques (aucune publication Jenkins)
  ansible.builtin.systemd_service:
    name: autokom-domain-reconciler.timer
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Réactiver automatiquement DNS et HTTPS après changement de configuration
  ansible.builtin.systemd_service:
    name: autokom-domain-reconciler.path
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Démarrer le worker des exécutions
  ansible.builtin.systemd_service:
    name: autokom-deployment-worker
    enabled: true
    state: restarted
  when: not ansible_check_mode
